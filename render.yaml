# Render Blueprint: the cloud-save server (server/). Render › New › Blueprint › this repository.
services:
  - type: web
    name: checkout-server
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths: ["server/**"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Prisma Postgres' pooled connection does not hold the migration lock (P1002): migrations run without it
      # (only this one service migrates, at build time).
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Public ids (not secrets): the game's web client (audience of the phone's Google login) and the PC/Editor client.
      - key: GOOGLE_CLIENT_IDS
        value: 663095472642-8vg9kgj7o3fdfv56k74m0v37leaqb5ni.apps.googleusercontent.com,663095472642-6votj9sh26dh1nrqpnn196hf301jhtqk.apps.googleusercontent.com
      - key: GOOGLE_DESKTOP_CLIENT_ID
        value: 663095472642-6votj9sh26dh1nrqpnn196hf301jhtqk.apps.googleusercontent.com
      # Pasted by Lucas in Render (secret): the PC/Editor client's secret.
      - key: GOOGLE_DESKTOP_CLIENT_SECRET
        sync: false
      # Sign in with Apple (iPhone, 19/10): the app's bundle ids (public). The first one is the client id of Apple's
      # token API.
      - key: APPLE_BUNDLE_IDS
        value: com.lucasfurini.checkout,com.lucasfurini.checkout.dev
      # Optional, from the Apple Developer account (Keys › Sign in with Apple): lets the server revoke the Apple login
      # when a player deletes the account. Pasted by Lucas in Render (the .p8 key is a secret).
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      # Optional: Google login on the iPhone (an "iOS" OAuth client in Google Cloud for the bundle id). Add it to
      # GOOGLE_CLIENT_IDS too.
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
